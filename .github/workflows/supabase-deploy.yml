# Publica o Supabase (migrações + Edge Functions) sempre que há push para main
# com alterações em supabase/. O site (frontend) é publicado à parte pelo Cloudflare Pages.
#
# Segredos necessários (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token pessoal (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   password da base de dados do projeto
#   SUPABASE_PROJECT_ID    vwlzarmijxqwmiwtzxlc
name: Supabase deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch: {}

# Nunca correr dois deploys em simultâneo; o seguinte espera pelo anterior.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Ligar ao projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # As migrações vão primeiro: as funções podem depender de colunas/funções novas.
      - name: Aplicar migrações
        run: supabase db push --linked --yes

      # O verify_jwt de cada função vem do supabase/config.toml.
      - name: Publicar Edge Functions
        run: |
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            case "$name" in
              # _shared: código partilhado, não é uma função.
              # sync-market-prices: desligada (dependia do Lovable); ver src/hooks/useMarketPrices.ts.
              _shared|sync-market-prices) continue ;;
            esac
            echo "::group::$name"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_ID" --use-api
            echo "::endgroup::"
          done
